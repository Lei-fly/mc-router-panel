# ============================================================
# 自动构建并发布 mc-router-panel 镜像到 GitHub Container Registry
# ------------------------------------------------------------
# 触发：
#   - push 到 main / master        → 打 latest
#   - push v* 版本 tag             → 打版本号标签 (v1.2.3 / 1.2.3 / 1.2 / 1)
#   - workflow_dispatch            → 手动触发
# 产物：ghcr.io/<owner>/mc-router-panel  (amd64 + arm64 多架构)
#
# 构建策略：原生 runner 矩阵 + manifest 合并
#   - amd64 跑 ubuntu-latest（x86_64 原生）
#   - arm64 跑 ubuntu-24.04-arm（arm64 原生，GitHub 免费 GA）
#   各架构在原生 runner 上构建，推到「稳定的单架构标签」arch-amd64/arch-arm64（每次覆盖不堆积），
#   再由 merge job 用 imagetools 组装出对外的多架构标签(:latest/:版本号/:sha)。
#   不走 QEMU（模拟慢且并行构建易 OOM），全程原生、稳定、快速；provenance 关闭避免元数据刷屏。
#
# ⚠️ GHCR 清理规则（重要，违反会导致 :latest 子 manifest 悬空损坏）：
#   - 只可删除旧 commit 对应的多架构主版本（标签如 :sha-<旧7位sha> / :v旧版本号）
#   - 严禁删除 arch-amd64 / arch-arm64 —— 它们是 :latest 等多架构标签的子镜像依赖
# 鉴权：使用内置 GITHUB_TOKEN，无需额外 PAT。
# ============================================================
name: Build and Publish Image

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # 镜像名固定为 mc-router-panel；命名空间取仓库 owner 的小写形式（GHCR 要求全小写）
  IMAGE_NAME: ${{ github.repository_owner }}/mc-router-panel

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GHCR 镜像地址必须全小写；本步骤统一小写化，避免大小写敏感问题
      - name: 小写化镜像名
        id: image
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 单架构镜像打稳定标签 arch-<arch>（每次覆盖，不堆积）：
      #   - 它是 :latest 多架构 manifest 的子镜像依赖，必须始终保留
      #   - 清理时只能删旧 commit 的多架构主版本(:sha-<旧sha>)，绝不删 arch-*
      #   - 否则 :latest 的子 manifest 会悬空（参考 GHCR 损坏事故）
      - name: 构建并推送（${{ matrix.suffix }}）
        uses: docker/build-push-action@v6
        with:
          context: ./panel
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}/mc-router-panel:arch-${{ matrix.suffix }}
          # 禁用 provenance/attestation，避免产生无标签的元数据 version 刷屏
          provenance: false
          # GitHub Actions 缓存按架构隔离（用 suffix 区分 scope，避免跨架构缓存污染）
          cache-from: type=gha,scope=${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.suffix }}

  # 引用两个单架构镜像 → 组装对外的多架构标签(:latest / 版本号 / sha)
  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 小写化镜像名
        id: image
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 最终对外标签：默认分支 latest / semver 版本号 / commit sha
      - name: 提取最终标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}/mc-router-panel
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short

      - name: 组装多架构 manifest
        env:
          BASE: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}/mc-router-panel
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          # imagetools create 直接在 registry 端操作 manifest，无需（也无法）跨架构 docker pull。
          # needs.build 已保证两架构镜像就绪，引用稳定的 arch-* 标签组装对外多架构标签。
          # ⚠️ arch-amd64/arch-arm64 是 :latest 等多架构标签的子镜像依赖，清理时严禁删除。
          for tag in $TAGS; do
            docker buildx imagetools create -t "$tag" \
              "${BASE}:arch-amd64" \
              "${BASE}:arch-arm64"
          done
          echo "✅ 多架构镜像已合并并推送："
          docker buildx imagetools inspect "${BASE}:latest"
